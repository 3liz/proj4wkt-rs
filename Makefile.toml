[tasks.default]
alias = "defaults"

[tasks.defaults]
dependencies = [
    "build"
]

[tasks.build]
command = "cargo"
args = ["build"]

[tasks."wasm.build"]
description = "Build wasm module (web target)" 
command = "wasm-pack"
args = [
    "build",
    "--release",
    "--target=web",
    "--no-default-features",
    "--features=logging",
]


[tasks."wasm.debug"]
description = "Build wasm module (debug web target)" 
command = "wasm-pack"
args = [
    "build",
    "--release",
    "--target=web",
    "--no-default-features",
    "--features=logging",
]



[tasks."wasm.package"]
description = "Package wasm web module"
env = { "PROJWKT_PACKAGE" = "${CARGO_MAKE_CRATE_FS_NAME}-${CARGO_MAKE_CRATE_VERSION}.tgz" }
dependencies = [
    "wasm.build"
]
command = "tar"
args = [
    "-czvf",
    "${PROJWKT_PACKAGE}",
    "--transform=s/pkg/${CARGO_MAKE_CRATE_FS_NAME}/",
    "pkg",
]
